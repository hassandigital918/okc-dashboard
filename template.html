<title>Oklahoma Climate Solutions SEO Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: brand gradient bar, header, one-line progress strip, then a two-column working grid that stacks on phones. */
:root {
  --bg: #F3F6F9; --surface: #FFFFFF; --sunk: #EEF3F7; --ink: #0E1E2B; --muted: #566877; --line: #DAE3EA;
  --blue: #0F78B1; --blue-soft: #E3EFF7; --teal: #1B8EA4; --teal-fill: #28A4BC; --teal-soft: #E1F3F6;
  --orange: #D86A06; --orange-fill: #F88415; --orange-soft: #FEEFE0; --amber: #FBBA3C; --amber-soft: #FFF5DD; --amber-ink: #8A5A00;
  --dot: #D5DEE6; --logo-filter: none; --shadow: 0 1px 2px rgba(14,30,43,.06), 0 6px 18px rgba(14,30,43,.05);
  --display: 'Montserrat', 'Segoe UI', Arial, sans-serif;
  --body: 'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A141D; --surface: #111F2B; --sunk: #0D1923; --ink: #E4ECF2; --muted: #93A5B4; --line: #1F3243;
  --blue: #4BA9DE; --blue-soft: #10283A; --teal: #45C4D9; --teal-fill: #2FAFC6; --teal-soft: #0E2A31;
  --orange: #FF9D45; --orange-fill: #F88415; --orange-soft: #2E1E0F; --amber: #FBBA3C; --amber-soft: #2B2410; --amber-ink: #FBCB6A;
  --dot: #223647; --logo-filter: invert(1) brightness(1.05); --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A141D; --surface: #111F2B; --sunk: #0D1923; --ink: #E4ECF2; --muted: #93A5B4; --line: #1F3243;
  --blue: #4BA9DE; --blue-soft: #10283A; --teal: #45C4D9; --teal-fill: #2FAFC6; --teal-soft: #0E2A31;
  --orange: #FF9D45; --orange-fill: #F88415; --orange-soft: #2E1E0F; --amber: #FBBA3C; --amber-soft: #2B2410; --amber-ink: #FBCB6A;
  --dot: #223647; --logo-filter: invert(1) brightness(1.05); --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; }
.brandbar { height: 5px; background: linear-gradient(90deg, #0F78B1, #28A4BC 38%, #FBBA3C 70%, #F88415); }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 40px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.eyebrow { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--blue); }
a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; }
header.top img { height: 46px; width: auto; filter: var(--logo-filter); }
.hmeta { text-align: right; display: grid; gap: 2px; }
.hmeta h1 { font-size: 20px; font-weight: 700; }
.hmeta .sub { color: var(--muted); font-size: 14px; }

.strip { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; display: grid;
  grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 18px; align-items: center; box-shadow: var(--shadow); }
.timeline { display: grid; gap: 8px; min-width: 0; }
.timeline .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.track { position: relative; height: 10px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, #0F78B1, #28A4BC); }
.months { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 12px; color: var(--muted); }
.months span { border-left: 1px solid var(--line); padding-left: 6px; }
.months span.now { color: var(--ink); font-weight: 600; }
.stat { display: grid; gap: 2px; border-left: 1px solid var(--line); padding-left: 16px; }
.stat b { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }

.update { background: var(--blue-soft); border-radius: 10px; padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.update .eyebrow { color: var(--blue); }

section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); align-content: start; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.card-head .note { font-size: 13px; color: var(--muted); }

.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.meter { background: var(--sunk); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.meter .k { font-size: 13px; font-weight: 600; }
.meter .v { font-family: var(--display); font-size: 22px; font-weight: 700; }
.meter .v small { font-size: 13px; font-weight: 600; color: var(--muted); }
.meter .bar { height: 6px; border-radius: 4px; background: var(--dot); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--teal-fill); border-radius: 4px; }
.meter .u { font-size: 12px; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font: 600 13px var(--display); border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.kw { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.kw:first-of-type { border-top: 0; }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 84px; }
.grid7 i { aspect-ratio: 1; border-radius: 50%; background: var(--dot); max-width: 100%; }
.grid7 i.r1 { background: var(--teal-fill); } .grid7 i.r2 { background: var(--amber); } .grid7 i.r3 { background: var(--orange-fill); } .grid7 i.r4 { background: #C95C5C; }
.kw h3 { font-size: 15px; font-weight: 700; }
.kw .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 3px; }
.kw .rank { font-weight: 600; color: var(--ink); }
.season { font: 700 10px var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; vertical-align: 2px; margin-left: 6px; }
.season.heat { background: var(--orange-soft); color: var(--orange); }
.season.cool { background: var(--blue-soft); color: var(--blue); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

.days { display: grid; gap: 12px; }
.day h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; margin-bottom: 6px; }
.day.today h3 { color: var(--blue); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.items li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--sunk); }
.items .l { min-width: 0; }
.items .a { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.items .t { font-size: 14px; overflow-wrap: anywhere; }
.chip { font: 600 11px var(--display); padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
.chip.done { background: var(--teal-soft); color: var(--teal); }
.chip.progress { background: var(--blue-soft); color: var(--blue); }
.chip.waiting { background: var(--amber-soft); color: var(--amber-ink); }
.chip.scheduled { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.empty { color: var(--muted); font-size: 14px; background: var(--sunk); border-radius: 8px; padding: 12px 14px; }

.needs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.needs li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--blue); margin-top: 2px; display: grid; place-items: center; }
.needs li.ok .box { background: var(--teal-fill); border-color: var(--teal-fill); }
.needs li.ok .box::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.needs b { font-weight: 600; }
.needs .h { color: var(--muted); }
.needs li.ok .h { color: var(--teal); }

.chat { display: grid; gap: 10px; }
.thread { display: grid; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px 2px; }
.msg { max-width: 86%; padding: 9px 12px; border-radius: 12px; font-size: 14px; display: grid; gap: 2px; }
.msg .who { font-size: 11px; font-weight: 600; color: var(--muted); }
.msg.client { justify-self: end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
.msg.client .who { color: rgba(255,255,255,.8); }
.msg.team { justify-self: start; background: var(--sunk); border-bottom-left-radius: 4px; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.compose { display: grid; gap: 8px; }
.compose .row { display: flex; gap: 8px; flex-wrap: wrap; }
.compose input, .compose textarea { font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
.compose input { flex: 1 1 160px; width: auto; }
.compose textarea { min-height: 76px; resize: vertical; }
.compose button { font: 700 14px var(--display); background: var(--orange-fill); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
.compose button:disabled { opacity: .55; cursor: default; }
.chat .status { font-size: 13px; color: var(--muted); min-height: 1.3em; }
.chat .status.err { color: var(--orange); }

.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.recent li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.recent li:first-child { border-top: 0; }
.recent .d { color: var(--muted); font-size: 12px; padding-top: 2px; }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 900px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .timeline { grid-column: 1 / -1; }
  .stat:nth-of-type(2) { border-left: 0; padding-left: 0; }
}
@media (max-width: 520px) {
  .hmeta { text-align: left; }
  .strip { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stat { border-left: 0; padding-left: 0; }
  .kw { grid-template-columns: 64px minmax(0, 1fr); } .grid7 { width: 64px; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="brandbar"></div>
<div class="wrap">
  <header class="top">
    <img src="__LOGO__" alt="Oklahoma Climate Solutions, Heating and Air Conditioning" width="203" height="46">
    <div class="hmeta">
      <h1>Local SEO Progress</h1>
      <div class="sub" id="hsub"></div>
    </div>
  </header>

  <div class="strip" id="strip"></div>
  <div class="update" id="update" hidden></div>

  <section class="card" aria-labelledby="m-h">
    <div class="card-head"><h2 id="m-h"></h2><span class="note">Monthly targets from your Local SEO Growth Package</span></div>
    <div class="meters" id="meters"></div>
  </section>

  <div class="grid2">
    <div class="col">
      <section class="card" aria-labelledby="k-h">
        <div class="card-head"><h2 id="k-h">Map-pack keyword targets</h2><div class="tabs" role="tablist" id="ktabs"></div></div>
        <div id="kwlist"></div>
        <div class="legend"><span><i style="background:var(--teal-fill)"></i>Top 3</span><span><i style="background:var(--amber)"></i>4 to 10</span><span><i style="background:var(--orange-fill)"></i>11 to 20</span><span><i style="background:var(--dot)"></i>Not yet ranked or not scanned</span></div>
      </section>
      <section class="card" aria-labelledby="w-h">
        <div class="card-head"><h2 id="w-h">This week</h2><span class="note" id="wnote"></span></div>
        <div class="days" id="days"></div>
      </section>
    </div>
    <div class="col">
      <section class="card" aria-labelledby="c-h">
        <div class="card-head"><h2 id="c-h">Messages</h2><span class="note">Your SEO team replies within one business day</span></div>
        <div class="chat">
          <div class="thread" id="thread" aria-live="polite"></div>
          <form class="compose" id="compose">
            <div class="row"><input id="c-name" name="name" autocomplete="name" placeholder="Your name" aria-label="Your name" maxlength="60" value="Sebastian"></div>
            <textarea id="c-text" name="text" placeholder="Ask a question, share a special, or send us an update" aria-label="Message" maxlength="2000" required></textarea>
            <div class="row"><button type="submit" id="c-send">Send message</button></div>
          </form>
          <div class="status" id="c-status"></div>
        </div>
      </section>
      <section class="card" aria-labelledby="n-h">
        <div class="card-head"><h2 id="n-h">What we need from you</h2><span class="note" id="nnote"></span></div>
        <ul class="needs" id="needs"></ul>
      </section>
      <section class="card" aria-labelledby="r-h">
        <div class="card-head"><h2 id="r-h">Recently completed</h2></div>
        <ul class="recent" id="recent"></ul>
      </section>
    </div>
  </div>

  <footer>
    <span id="fagency"></span>
    <span id="fupdated"></span>
  </footer>
</div>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d8 = s => new Date(s + 'T12:00:00');
const fmt = (s, o) => d8(s).toLocaleDateString('en-US', o);
const MONTHS = {'2026-10': 'October', '2026-11': 'November', '2026-12': 'December'};
const LABEL = {done: 'Completed', progress: 'In progress', waiting: 'Waiting on access', scheduled: 'Scheduled'};

$('hsub').textContent = `${D.client} · ${fmt(D.program.start, {month:'short', day:'numeric'})} to ${fmt(D.program.end, {month:'short', day:'numeric', year:'numeric'})}`;

// progress strip
(() => {
  const p = D.progress, pct = Math.round(100 * p.elapsed / p.days);
  const mk = Object.keys(MONTHS).map(k => `<span class="${k === D.month ? 'now' : ''}">${MONTHS[k]}</span>`).join('');
  $('strip').innerHTML = `
    <div class="timeline">
      <div class="row"><span class="eyebrow">Program timeline</span><span class="num">Week ${p.week} of ${p.weeks}</span></div>
      <div class="track" role="img" aria-label="${pct}% of the program elapsed"><i style="width:${Math.max(pct, 1.5)}%"></i></div>
      <div class="months">${mk}</div>
    </div>
    <div class="stat"><b class="num">${p.done}</b><span>tasks completed</span></div>
    <div class="stat"><b class="num">${p.active}</b><span>in progress now</span></div>
    <div class="stat"><b class="num">${p.total}</b><span>tasks planned in total</span></div>`;
})();

if (D.update && D.update.text) {
  $('update').hidden = false;
  $('update').innerHTML = `<span class="eyebrow">Latest update · ${esc(fmt(D.update.date, {month:'short', day:'numeric'}))}</span><span>${esc(D.update.text)}</span>`;
}

// monthly meters
$('m-h').textContent = `${MONTHS[D.month] || ''} deliverables`;
$('meters').innerHTML = D.monthly.map(m => {
  const top = typeof m.target === 'string' ? parseInt(m.target.split('-').pop()) : m.target;
  const pct = top ? Math.min(100, Math.round(100 * m.done / top)) : 0;
  return `<div class="meter"><span class="k">${esc(m.name)}</span>
    <span class="v num">${m.done} <small>of ${esc(String(m.target).replace('-', ' to '))}</small></span>
    <span class="bar"><i style="width:${pct}%"></i></span><span class="u">${esc(m.unit)}</span></div>`;
}).join('');

// keywords
const kMonths = [...new Set(D.keywords.map(k => k.month))];
let kSel = kMonths.includes(D.month) ? D.month : kMonths[0];
function grid7(r) {
  let cells = '';
  for (let i = 0; i < 49; i++) {
    const v = r && r.grid ? r.grid[i] : null;
    const c = v == null ? '' : v <= 3 ? 'r1' : v <= 10 ? 'r2' : v <= 20 ? 'r3' : 'r4';
    cells += `<i class="${c}"></i>`;
  }
  return `<div class="grid7" role="img" aria-label="${r ? 'Map ranking grid across Oklahoma City' : 'Not scanned yet'}">${cells}</div>`;
}
function renderKw() {
  $('ktabs').innerHTML = kMonths.map(m => `<button role="tab" aria-selected="${m === kSel}" data-m="${m}">${MONTHS[m] || m}</button>`).join('');
  $('kwlist').innerHTML = D.keywords.filter(k => k.month === kSel).map(k => {
    const r = D.rankings[k.kw];
    const vol = `${k.vol.toLocaleString()} searches/mo in OKC${k.near ? ` (+${k.near} "near me")` : ''}`;
    const rank = r ? `<span class="rank">Average map rank ${esc(r.arp)}${r.prev ? `, was ${esc(r.prev)}` : ''}</span>` : `<span>First ranking scan in October</span>`;
    return `<div class="kw">${grid7(r)}<div><h3>${esc(k.kw)}<span class="season ${k.season}">${k.season === 'heat' ? 'Heating' : 'Cooling'}</span></h3>
      <div class="meta"><span class="num">${vol}</span>${rank}<span>Page: ${esc(k.page)}</span></div></div></div>`;
  }).join('');
}
$('ktabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { kSel = b.dataset.m; renderKw(); } });
renderKw();

// week
const item = t => `<li><span class="l"><span class="a">${esc(t.area)}</span><span class="t">${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.label)}</a>` : esc(t.label)}</span></span><span class="chip ${t.status}">${LABEL[t.status]}</span></li>`;
$('days').innerHTML = D.week.map(d => `<div class="day ${d.date === D.today ? 'today' : ''}"><h3>${fmt(d.date, {weekday:'long', month:'short', day:'numeric'})}${d.date === D.today ? ' · Today' : ''}</h3>
  ${d.items.length ? `<ul class="items">${d.items.map(item).join('')}</ul>` : '<div class="empty">Nothing scheduled</div>'}</div>`).join('') || '<div class="empty">The program has finished.</div>';
$('wnote').textContent = D.week.length ? `${fmt(D.week[0].date, {month:'short', day:'numeric'})} to ${fmt(D.week[D.week.length - 1].date, {month:'short', day:'numeric'})}` : '';

// needs
const open = D.needs.filter(n => !n.done).length;
$('nnote').textContent = open ? `${open} of ${D.needs.length} still open` : 'All set, thank you';
$('needs').innerHTML = D.needs.map(n => `<li class="${n.done ? 'ok' : ''}"><span class="box" aria-hidden="true"></span><span><b>${esc(n.item)}:</b> <span class="h">${esc(n.done ? (n.note || 'Done') : n.how)}</span></span></li>`).join('');

// recent
$('recent').innerHTML = D.recent.length ? D.recent.map(t => `<li><span class="d num">${fmt(t.date, {month:'short', day:'numeric'})}</span><span>${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.label)}</a>` : esc(t.label)}</span></li>`).join('')
  : `<li><span class="d"></span><span class="empty" style="grid-column:1/-1">Completed work shows here as it's done, starting ${fmt(D.program.start, {month:'long', day:'numeric'})}.</span></li>`;

$('fagency').textContent = `Managed by ${D.agency.name} · ${D.agency.site} · ${D.agency.email}`;
$('fupdated').textContent = `Updated ${new Date(D.updated).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})} Oklahoma time`;

// messages (Google Apps Script endpoint; preview mode when none is set or it can't be reached)
const chat = { url: D.chat.url, token: D.chat.token, msgs: [], live: !!D.chat.url };
function drawThread() {
  const t = $('thread');
  if (!chat.msgs.length) { t.innerHTML = `<div class="empty">No messages yet. Send us a question or an update and we'll reply here.</div>`; return; }
  t.innerHTML = chat.msgs.map(m => `<div class="msg ${m.from === 'team' ? 'team' : 'client'}"><span class="who">${esc(m.from === 'team' ? (m.name || 'SEO team') : (m.name || 'You'))} · ${esc(new Date(m.at).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}))}</span><p>${esc(m.text)}</p></div>`).join('');
  t.scrollTop = t.scrollHeight;
}
async function loadMsgs() {
  if (!chat.live) return;
  try {
    const r = await fetch(`${chat.url}?t=${encodeURIComponent(chat.token)}`);
    const j = await r.json();
    if (Array.isArray(j.messages)) { chat.msgs = j.messages; drawThread(); }
  } catch (e) { $('c-status').textContent = "Messages couldn't load right now. Refresh the page to try again."; }
}
$('compose').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('c-name').value.trim(), text = $('c-text').value.trim();
  const st = $('c-status'); st.className = 'status';
  if (!text) { st.textContent = 'Type a message first.'; return; }
  if (!chat.live) {
    chat.msgs.push({ from: 'client', name, text, at: new Date().toISOString() });
    drawThread(); $('c-text').value = '';
    st.textContent = 'Preview only: this message stays on this screen and was not sent.'; return;
  }
  $('c-send').disabled = true; st.textContent = 'Sending…';
  try {
    const r = await fetch(chat.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ t: chat.token, name, text }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'failed');
    $('c-text').value = ''; st.textContent = 'Sent. We will reply here within one business day.';
    await loadMsgs();
  } catch (err) {
    st.className = 'status err'; st.textContent = `Your message wasn't sent. Check your connection and try again, or email ${D.agency.email}.`;
  } finally { $('c-send').disabled = false; }
});
drawThread();
if (chat.live) { loadMsgs(); setInterval(() => { if (!document.hidden) loadMsgs(); }, 45000); }
else { $('c-status').textContent = 'Preview: messaging goes live on the hosted dashboard.'; }
</script>
